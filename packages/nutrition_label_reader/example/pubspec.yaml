name: nutrition_label_reader_example
description: >-
  A Dart-only example. It parses a bundled synthetic label. It uses no camera
  and no native code.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nutrition_label_reader:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
